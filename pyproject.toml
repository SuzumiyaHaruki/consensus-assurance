[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consensus-assurance"
version = "0.1.0"
description = "Scoped correctness analysis with executable evidence"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7", "tomli>=2,<3; python_version<'3.11'", "tree-sitter>=0.25,<0.26", "tree-sitter-rust>=0.24,<0.25"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
consensus-assurance = "consensus_assurance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
consensus_assurance = ["resources/system.md", "resources/tasks/*.md", "resources/task-skills.json", "resources/skills/*/*.md", "resources/skills/*/references/*.md", "plugins/protocols/*/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: requires an installed external tool"]
