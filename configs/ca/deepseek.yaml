agent_backend: codex
agent_model: deepseek-flash
agent_reasoning_effort: high
codex_profile: single_agent
codex_provider:
  id: deepseek
  base_url: https://api.deepseek.com
  env_key: DEEPSEEK_API_KEY
  model_catalog_path: ../providers/deepseek-flash.models.json
runs_dir: ../../runs
execution_isolation: bwrap
allow_agent_materials: false
allow_experiments: false
budget:
  total_seconds: 3600
  agent_calls: 120
  agent_turn_timeout: 900
  action_timeout: 600
  experiments: 36
target_config: ../targets/hashicorp_raft.yaml
