# Use this provider block with an existing target; permissions remain explicit.
protocol: none
execution_backend: go_module
target:
  variant: generic_go_deepseek
  execution_package: .
agent_backend: codex
agent_model: deepseek-flash
agent_reasoning_effort: low
codex_provider:
  id: deepseek
  base_url: https://api.deepseek.com
  env_key: DEEPSEEK_API_KEY
  model_catalog_path: ../providers/deepseek-flash.models.json
runs_dir: ../../runs
execution_isolation: bwrap
allow_agent_materials: false
allow_experiments: false
budget:
  total_seconds: 2400
  agent_calls: 40
  experiments: 16
  action_timeout: 600
  agent_turn_timeout: 900
