# Small real-backend pilot; prepared only, not executed.
# Permissions remain disabled until the user authorizes material transmission and target execution.
# Two audit-unit slots allow a first unit and dependency expansion.
# Five executions cover one capability probe, two calibration experiments and up to two replays.
implementation: hashicorp_raft
protocol: none
repo_path: /home/nitro/Desktop/hashicorp-raft
agent_backend: codex
verifier_backend: tlc
runs_dir: ../../runs
tlc_jar: null
execution_isolation: bwrap
allow_agent_materials: false
allow_experiments: false
directed_question: null
fixture: null
parameters: {}
budget:
  agent_calls: 12
  model_checks: 3
  calibration_checks: 6
  experiments: 5
  replays: 2
  revisions: 3
  targeted_reads: 3
  technical_repairs: 2
  repeated_error_revisions: 1
  audit_units: 2
  material_chars: 80000
  material_chunks: 30
  error_context_chars: 16000
  action_timeout: 180
  total_seconds: 1200
