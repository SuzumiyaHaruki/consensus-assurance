# Explicit long-run example; supply --repo and authorize a local .run.yaml.
protocol: none
execution_backend: go_module
target:
  variant: generic_go
  execution_package: .
agent_backend: codex
agent_model: gpt-6-astra
agent_reasoning_effort: low
verifier_backend: none
runs_dir: ../../runs
execution_isolation: bwrap
allow_agent_materials: false
allow_experiments: false
budget:
  total_seconds: 4800
  agent_calls: 40
  experiments: 16
  audit_units: 6
  semantic_reviews: 10
  revisions: 6
  action_timeout: 600
  agent_turn_timeout: 900
