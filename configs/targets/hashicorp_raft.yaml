# Current seven-class audit template; no supplied goal.
# Running with transmission/execution enabled requires user authorization.
implementation: hashicorp_raft
protocol: none
repo_path: ../../target-source
agent_backend: codex
verifier_backend: tlc
runs_dir: ../../runs
tlc_jar: null
execution_isolation: bwrap
allow_agent_materials: false
allow_experiments: false
directed_question: null
fixture: null
parameters: {}
budget:
  agent_calls: 20
  exploration_rounds: 3
  semantic_reviews: 6
  # New source acquisition plans; cache attachment is not a new-source charge.
  targeted_reads: 6
  graph_objects: 1000
  outer_reserve_seconds: 120
  audit_units: 2
  # SANY parsing and model searches share this finite tool budget.
  model_checks: 3
  reachability_checks: 3
  consequence_investigations: 1
  calibration_checks: 6
  experiments: 5
  replays: 2
  revisions: 4
  technical_repairs: 2
  repeated_error_revisions: 1
  repair_attempts: 4
  repair_stagnation: 2
  material_chars: 120000
  material_chunks: 40
  error_context_chars: 16000
  action_timeout: 600
  total_seconds: 2400
  context_chars: 180000
  depth_material_reserve: 0.35
  breadth_material_reserve: 0.20
  trigger_retries: 1
  context_preparations: 2
