# Corrected EPaxos in imdea-software/swiftpaxos, commit 35c69365f1c7737a08e237bfbaf828ee68897080.
# Upstream has no tagged stable release; retain the full repository and select the EPaxos surface.
protocol: none
execution_backend: go_module
target:
  variant: swiftpaxos_epaxos
  expected_module: github.com/imdea-software/swiftpaxos
  execution_package: ./epaxos
  harness_path: epaxos/assurance_generated_test.go
  analysis_roots: [README.md, LICENSE, go.mod, go.sum, main.go, run.go, aws.conf, quorum.conf, latency.conf, client, config, dlog, hook, master, replica, rpc, state, epaxos]
agent_backend: codex
agent_model: gpt-6-astra
agent_reasoning_effort: low
runs_dir: ../../runs
execution_isolation: bwrap
allow_agent_materials: false
allow_experiments: false
directed_question: null
fixture: null
budget:
  total_seconds: 2400
  agent_calls: 40
  experiments: 16
  audit_units: 6
  semantic_reviews: 10
  revisions: 6
  action_timeout: 600
  agent_turn_timeout: 900
