protocol: raft
implementation: hashicorp_raft
repo_path: ~/Desktop/hashicorp-raft
agent_backend: codex
verifier_backend: tlc
output_language: zh-CN
runs_dir: ../../runs
# Set an absolute path or export TLC_JAR.
tlc_jar: null
execution_isolation: bwrap
allow_experiments: true
# Optional exploration bounds; no goal or protocol state is preselected.
parameters: {}
budget:
  agent_calls: 8
  model_checks: 4
  calibration_checks: 8
  experiments: 4
  audit_units: 2
  revisions: 3
  repeated_error_revisions: 1
  replays: 1
  action_timeout: 120
  total_seconds: 900
  material_chars: 120000
  material_chunks: 40
