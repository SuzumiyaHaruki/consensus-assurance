# Safe configuration example. Override repo_path with the intended local checkout.
execution_backend: go_module
target:
  variant: hashicorp_raft
  expected_module: github.com/hashicorp/raft
  execution_package: .
  harness_path: assurance_generated_test.go
protocol: none
repo_path: ../../target-source
agent_backend: codex
agent_reasoning_effort: low
activity_focus: [A1, A2]
verifier_backend: tlc
runs_dir: ../../runs
execution_isolation: bwrap
allow_agent_materials: false
allow_experiments: false
directed_question: null
budget:
  agent_calls: 40
  exploration_rounds: 4
  semantic_reviews: 6
  graph_objects: 1000
  audit_units: 4
  # SANY parsing and model searches share this finite tool budget.
  model_checks: 6
  reachability_checks: 3
  consequence_investigations: 1
  calibration_checks: 6
  experiments: 8
  replays: 2
  revisions: 4
  technical_repairs: 2
  repeated_error_revisions: 1
  repair_attempts: 4
  repair_stagnation: 2
  material_chars: 240000
  material_chunks: 40
  error_context_chars: 16000
  action_timeout: 600
  total_seconds: 4800
  context_chars: 180000
  depth_material_reserve: 0.35
  breadth_material_reserve: 0.20
  trigger_retries: 1
  context_preparations: 2
