# OmniPaxos 0.2.3 published source: 827f304846ab0c5aa40910b6f6cdce1d4ddf8e12.
# Cargo integration tests use the captured public API; original dev-dependencies may enable additional features.
protocol: none
execution_backend: cargo
# Optional local reuse: copy this file to omnipaxos.run.yaml (Git-ignored), then set
# cargo_seed_cache_dir: ~/.cache/consensus-assurance/cargo-seeds
# Keep the default disabled; use an absolute or ~ path outside source and runs.
target:
  variant: omnipaxos
  execution_package: omnipaxos
  harness_path: omnipaxos/tests/assurance_generated.rs
agent_backend: codex
agent_model: gpt-6-astra
agent_reasoning_effort: low
runs_dir: ../../runs
execution_isolation: bwrap
allow_agent_materials: false
allow_experiments: false
directed_question: null
fixture: null
budget:
  total_seconds: 2400
  agent_calls: 40
  experiments: 16
  action_timeout: 1200
  agent_turn_timeout: 900
