# Diagnostic pairing draft; use a fresh private CODEX_HOME for each independent run.
protocol: none
execution_backend: go_module
target:
  variant: hashicorp_raft
  expected_module: github.com/hashicorp/raft
  execution_package: .
  harness_path: assurance_generated_test.go
repo_path: ../../../hashicorp-raft
agent_backend: codex
agent_model: deepseek-flash
agent_reasoning_effort: high
codex_profile: single_agent
codex_provider:
  id: deepseek
  base_url: https://api.deepseek.com
  env_key: DEEPSEEK_API_KEY
  model_catalog_path: ../../configs/providers/deepseek-flash.models.json
runs_dir: ../../runs
execution_isolation: bwrap
allow_agent_materials: false
allow_experiments: false
directed_question: null
fixture: null
budget:
  total_seconds: 3600
  agent_calls: 120
  agent_turn_timeout: 900
  action_timeout: 600
  experiments: 36
  audit_units: 12
  semantic_reviews: 24
  revisions: 12
  repair_attempts: 12
  graph_objects: 1000
