# Diagnostic pairing draft; model calls require separate authorization.
baseline_id: codex_plain
target_config: ../../configs/targets/hashicorp_raft.yaml
repo_path: ../../../hashicorp-raft
agent_model: deepseek-flash
agent_reasoning_effort: high
codex_provider:
  id: deepseek
  base_url: https://api.deepseek.com
  env_key: DEEPSEEK_API_KEY
  model_catalog_path: ../../configs/providers/deepseek-flash.models.json
auth_mode: api_key
go_mod_cache_dir: ~/go/pkg/mod
runs_dir: ../runs
allow_agent_materials: false
allow_experiments: false
budget:
  total_seconds: 2400
  agent_calls: 120
  agent_turn_timeout: 900
  action_timeout: 600
