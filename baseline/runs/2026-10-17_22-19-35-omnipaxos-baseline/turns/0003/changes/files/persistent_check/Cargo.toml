[package]
name = "omnipaxos-persistent-atomicity-check"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
omnipaxos = { path = "../omnipaxos", features = ["serde"] }
omnipaxos_storage = { path = "../omnipaxos_storage", features = ["persistent_storage"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
