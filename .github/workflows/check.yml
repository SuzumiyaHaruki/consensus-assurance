name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,baseline]'
      - run: python -m pytest -q -m 'not real'
      - run: git diff --check
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Installed CLI and method resources outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          consensus-assurance --help
          python -I -c 'from importlib.resources import files; import json; r=files("consensus_assurance").joinpath("resources"); m=json.loads((r/"task-skills.json").read_text()); assert (r/"system.md").is_file(); assert (r/"tasks/audit.md").is_file(); assert (r/"skills/evidence-review/SKILL.md").is_file(); print(m["version"])'
